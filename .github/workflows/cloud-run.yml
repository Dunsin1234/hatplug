# This workflow will build and deploy using Cloud Run.

name: Cloud Run Continuous Deployment

on:
  push:
    branches: ['main']
  release:
    types: [published]

env:
  PROJECT_ID: oluwadunsin-adesanya-fisk
  SERVICE_NAME: hat-plug
  SERVICE_REGION: us-central1
  # Set these two as GitHub repository variables (Settings > Secrets and
  # variables > Actions > Variables). scripts/setup-github-deploy.sh prints them.
  SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  py-checks:
    uses: ./.github/workflows/python-checks.yml
    
  build-deploy:
    name: 'Build and deploy using Cloud Run'
    runs-on: ubuntu-latest
    needs: py-checks

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - uses: 'actions/checkout@v4'
    # Authorize GitHub to connect to your service account
    - uses: 'google-github-actions/auth@v2'
      with:
        project_id: '${{ env.PROJECT_ID }}'
        workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER}}'
        service_account: '${{ env.SERVICE_ACCOUNT }}'
    
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        project_id: '${{ env.PROJECT_ID }}'
        version: '>= 363.0.0'

    # Same two steps as manual-deploy.sh: build in Cloud Build, then deploy.
    - name: 'Build image with Cloud Build'
      run: |
        # --suppress-logs: the deploy account can't stream logs, but the command
        # still waits for the build and fails if it fails. The "Logs are
        # available at" link in the output opens the build in the console.
        gcloud builds submit --suppress-logs \
          --project "${PROJECT_ID}" \
          --tag "gcr.io/${PROJECT_ID}/${SERVICE_NAME}"

    - name: 'Deploy to Cloud Run'
      run: |
        gcloud run deploy "${SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --image "gcr.io/${PROJECT_ID}/${SERVICE_NAME}:latest" \
          --region "${SERVICE_REGION}" \
          --allow-unauthenticated

    - name: 'Show deployed URL'
      run: |
        gcloud run services describe "${SERVICE_NAME}" \
          --project "${PROJECT_ID}" --region "${SERVICE_REGION}" \
          --format='value(status.url)'
